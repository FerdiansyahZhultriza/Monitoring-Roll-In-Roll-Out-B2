/* intro dan halaman kunci: gambar teknik digambar garis demi garis, lalu menyala mengikuti arah gas */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#021A2E;color:#fff;transition:opacity .55s ease}
.intro[hidden]{display:none}
.intro.pergi{opacity:0;pointer-events:none}
.ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(820px,100%);padding:12px 16px;box-sizing:border-box;text-align:center}
.ilogo{height:46px;width:auto;display:block;opacity:0;animation:ifade .6s ease .1s forwards}
.isvg{display:block;width:100%;max-height:50vh;overflow:visible}
.il{fill:none;stroke:#00AAEB;stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;animation:igaris 1.2s cubic-bezier(.16,1,.3,1) var(--d,0s) forwards}
.ip{fill:var(--c);fill-opacity:0;stroke:#7BD3F7;stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;animation:igaris 1s cubic-bezier(.16,1,.3,1) var(--d,0s) forwards,inyala .5s ease var(--n,1.5s) forwards}
.iapi{fill:none;stroke:#FFEC00;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.9;animation:igaris 1.1s ease-in 1.25s forwards,ifadeout .6s ease 2.3s forwards}
.ia{stroke:#5E93B4;stroke-width:1;stroke-dasharray:26 5 4 5;opacity:0;animation:ifade .8s ease .4s forwards}
.itxt{margin:0;font-family:"MK2 Display","Poppins","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4.2vw,40px);letter-spacing:-.02em;line-height:1.1;opacity:0;animation:ifade .7s ease 2.15s forwards}
.itxt span{display:block;margin-top:5px;font-family:"MK2 Label","Arial Narrow",Arial,sans-serif;font-weight:400;font-size:clamp(15px,2vw,18px);letter-spacing:0;color:#9FC9E2}
.ibar{width:min(320px,70vw);height:4px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0;animation:ifade .3s ease 2.2s forwards}
.ibar i{display:block;height:100%;background:linear-gradient(90deg,#FFEC00 0 82%,#E71C24 82% 86%,#00AAEB 86%);transform-origin:left;transform:scaleX(0);animation:ibar 1.2s ease-out 2.3s forwards}
.intro.quick *{animation:none!important}
.intro.quick .ilogo,.intro.quick .itxt,.intro.quick .ibar{opacity:1}
.intro.quick .il,.intro.quick .ip{stroke-dashoffset:0}
.intro.quick .ip{fill-opacity:1;stroke:#021A2E}
.intro.quick .ia{opacity:1}
.intro.quick .iapi{opacity:0}
.intro.quick .ibar i{transform:none}
@keyframes igaris{to{stroke-dashoffset:0}}
@keyframes inyala{to{fill-opacity:1;stroke:#021A2E}}
@keyframes ifade{to{opacity:1}}
@keyframes ifadeout{to{opacity:0}}
@keyframes ibar{to{transform:none}}
@media (prefers-reduced-motion:reduce){
  .intro *{animation:none!important}
  .ilogo,.itxt,.ibar,.ia{opacity:1}
  .il,.ip{stroke-dashoffset:0}
  .ip{fill-opacity:1;stroke:#021A2E}
  .iapi{opacity:0}
  .ibar i{transform:none}
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#021A2E;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;overflow:hidden}
.card{width:min(380px,100%);margin-top:4px;padding:14px 16px 12px;text-align:left;background:#03304F;border:1px solid #2A6A92;border-radius:2px;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .5s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.intro.ask .card{opacity:1;transform:none;pointer-events:auto}
.intro.ok .card{opacity:0;pointer-events:none}
.intro.ask .ibar{display:none}
.intro.busy .ibar,.intro.ok .ibar{display:block;opacity:1}
.intro.busy .ibar i{animation:load 1.3s ease-in-out infinite}
.intro.ok .ibar i{animation:none;transform:none}
.card .lk{margin:0 0 10px;font-family:"MK2 Label","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:16px;color:#E6F1F8}
.row{display:flex;gap:8px}
label.pl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;color:#fff;background:#021A2E;border:1px solid #2A6A92;border-radius:2px;padding:10px 12px;outline:none}
input[type=password]:focus,input[type=text]:focus{border-color:#00AAEB;box-shadow:0 0 0 2px rgba(0,170,235,.35)}
button{font:inherit;font-family:"MK2 Label","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:17px;border:0;border-radius:2px;padding:10px 20px;background:#FFEC00;color:#021A2E;cursor:pointer}
button:hover{background:#FFF36B}
button[disabled]{opacity:.65;cursor:default}
:focus-visible{outline:2px solid #FFEC00;outline-offset:2px}
.eye{display:flex;gap:7px;align-items:center;font-size:13px;color:#BBD6E6;margin-top:8px;cursor:pointer;width:max-content}
.eye input{margin:0}
.msg{min-height:1.2em;margin:6px 0 0;font-size:13.5px;color:#FFB3B6}
.fine{margin:4px 0 0;font-size:12px;line-height:1.4;color:#9CC1D8}
.intro.shake .card{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes load{0%{transform:scaleX(.05);transform-origin:left}50%{transform:scaleX(.85);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(.05);transform-origin:right}}
@media (max-height:680px){.isvg{max-height:36vh}.ilogo{height:34px}.itxt span{display:none}}
noscript{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#FFD8DA;font-size:14px}
</style>
